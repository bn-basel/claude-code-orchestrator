<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diagram sources</title>
<!--
  Source for the README diagrams. Each figure is drawn from the data below, so edit the data, not coordinates.
  Render (any headless Chrome works; example with Playwright):
    light: diagrams.html            dark: diagrams.html?theme=dark
    screenshot each #loop / #team / #workspace element at device scale 2 → docs/assets/<name>-<theme>.png
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --board: #faf9f6; --surface: #ffffff; --ink: #15171a; --ink-2: #454a52; --ink-3: #6b7078;
    --rule: #dcd8ce; --rule-2: #b9b4a8; --go: #16794a; --go-bg: #e8f3ec; --go-line: #8cc3a5;
    --warn: #b93a0a; --warn-bg: #fcefe7; --warn-line: #efb99c; --plate: #15171a; --plate-ink: #f3f1ec; --plate-ink-2: #a9a59c; --chip: #f1efe9;
  }
  html.dark {
    --board: #11161b; --surface: #182027; --ink: #ebe8e2; --ink-2: #bcc0c5; --ink-3: #8d949b;
    --rule: #26303a; --rule-2: #3b4652; --go: #4cc38a; --go-bg: #12291f; --go-line: #2f6b4c;
    --warn: #ff8a5c; --warn-bg: #2b1a12; --warn-line: #6b3a24; --plate: #ebe8e2; --plate-ink: #111416; --plate-ink-2: #4c535a; --chip: #212a33;
  }
  body { margin: 0; padding: 24px; background: transparent; }
  .fig { display: block; width: max-content; margin-bottom: 40px; }
  svg { display: block; }
  text { font-family: "IBM Plex Sans", system-ui, sans-serif; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .cond { font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif; }
</style>
</head>
<body>
<div class="fig" id="loop"></div>
<div class="fig" id="team"></div>
<div class="fig" id="workspace"></div>

<script>
if (/theme=dark/.test(location.search)) document.documentElement.classList.add('dark');
const NS = 'http://www.w3.org/2000/svg';
const C = (v) => `var(--${v})`;

function svgRoot(host, w, h) {
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('viewBox', `0 0 ${w} ${h}`);
  s.setAttribute('width', w); s.setAttribute('height', h);
  document.getElementById(host).appendChild(s);
  const defs = el(s, 'defs');
  for (const [id, col] of [['a-ink', 'ink'], ['a-warn', 'warn'], ['a-go', 'go']]) {
    const m = el(defs, 'marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 10, markerHeight: 10, orient: 'auto-start-reverse', markerUnits: 'userSpaceOnUse' });
    el(m, 'path', { d: 'M0 0L10 5L0 10z', fill: C(col) });
  }
  el(s, 'rect', { x: 0.5, y: 0.5, width: w - 1, height: h - 1, rx: 14, fill: C('board'), stroke: C('rule') });
  return s;
}
function el(parent, tag, attrs = {}, text) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  parent.appendChild(n);
  return n;
}
function txt(p, x, y, s, o = {}) {
  const cls = o.cls || '';
  return el(p, 'text', {
    x, y, class: cls, 'font-size': o.size || 13, 'font-weight': o.weight || 400,
    fill: o.fill || C('ink'), 'text-anchor': o.anchor || 'start',
    'letter-spacing': o.ls || 0, ...(o.extra || {}),
  }, s);
}
function chip(p, x, y, s, o = {}) {
  // pill with text; returns width. y is the pill's top.
  const g = el(p, 'g');
  const t = txt(g, 0, 0, s, { cls: 'mono', size: o.size || 11, fill: o.fill || C('ink-2'), weight: o.weight || 500 });
  const w = t.getComputedTextLength() + (o.pad || 10) * 2, h = o.h || 20;
  const left = o.anchor === 'end' ? x - w : x;
  el(g, 'rect', { x: left, y, width: w, height: h, rx: h / 2, fill: o.bg || C('chip'), stroke: o.stroke || 'none' });
  t.setAttribute('x', left + (o.pad || 10)); t.setAttribute('y', y + h / 2 + 4);
  g.appendChild(t);
  return w;
}
function warnOverflow(textNode, maxRight, label) {
  const b = textNode.getBBox();
  if (b.x + b.width > maxRight + 0.5) console.warn('overflow', label, Math.round(b.x + b.width - maxRight));
}

/* ───────────── 1. The loop: a flowchart from your prompt to live ───────────── */
function wrapText(p, x, y, str, maxW, o) {
  const lh = o.lh || 16, words = str.split(' ');
  let line = '', n = 0, t = txt(p, x, y, '', o);
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    t.textContent = test;
    if (t.getComputedTextLength() > maxW && line) { t.textContent = line; n++; t = txt(p, x, y + n * lh, w, o); line = w; }
    else line = test;
  }
  return n + 1;
}
function rounded(points, r = 8) {
  let d = `M${points[0][0]} ${points[0][1]}`;
  for (let i = 1; i < points.length - 1; i++) {
    const [px, py] = points[i - 1], [x, y] = points[i], [nx, ny] = points[i + 1];
    const ax = Math.sign(x - px) * r, ay = Math.sign(y - py) * r, bx = Math.sign(nx - x) * r, by = Math.sign(ny - y) * r;
    d += ` L${x - ax} ${y - ay} Q${x} ${y} ${x + bx} ${y + by}`;
  }
  const [lx, ly] = points[points.length - 1];
  return d + ` L${lx} ${ly}`;
}

function drawLoop() {
  const W = 940, CX = 470, BW = 300, BH = 56, GW = 200, GH = 38, GAP = 26;
  const BL = CX - BW / 2, BR = CX + BW / 2;
  const railR = BR + 80, railL = BL - 80, nextX = BL - 150;
  const s = svgRoot('loop', W, 2000);

  // Main line, top to bottom. Checks are yes/no questions; "no" goes back along a rail.
  const items = [
    { box: 'prompt', who: 'you', name: 'Your prompt', sub: 'Describe the feature in plain words' },
    { box: 'plan', who: 'orch', name: 'Plan', sub: 'Small tasks, each with a check' },
    { gate: 'You approve?', who: 'you', no: [{ side: 'L', label: 'no: change it' }] },
    { box: 'build', who: 'help', tag: 'HELPERS', name: 'Build', sub: 'Tests first if risky, then code' },
    { box: 'check', who: 'orch', name: 'Check by command', sub: 'Runs the tests, checks the files' },
    { gate: 'All checks pass?', no: [{ side: 'R', label: 'no: fix it' }] },
    { box: 'review', who: 'help', tag: 'HELPER · reviewer', name: 'Code review', sub: 'Sees only the plan and the diff' },
    { gate: 'Review clean?', no: [{ side: 'R', label: 'code problem' }, { side: 'L', label: 'design problem' }] },
    { box: 'pr', who: 'orch', name: 'Open the pull request', sub: 'Full test suite, one PR per feature' },
    { gate: 'CI green?', no: [{ side: 'R', label: 'no: fix it' }] },
    { box: 'merge', who: 'you', name: 'Merge', sub: 'Merging is deploying' },
    { box: 'verify', who: 'orch', name: 'Verify', sub: 'Feature on for one account first' },
    { gate: 'Works live?', no: [{ side: 'L', label: 'no: switch it off' }] },
    { box: 'learn', who: 'orch', name: 'Learn', sub: 'Update the plan, propose new rules' },
  ];
  const target = { L: 'plan', R: 'build' };

  txt(s, 28, 40, 'ONE FEATURE, FROM PROMPT TO LIVE', { cls: 'mono', size: 12, weight: 600, ls: 1.2, fill: C('ink-2') });

  // Layout
  let y = 70;
  const pos = {};
  for (const it of items) {
    it.top = y; it.h = it.box ? BH : GH; it.mid = y + it.h / 2;
    if (it.box) pos[it.box] = it;
    y += it.h + GAP;
  }
  const bottom = y - GAP;

  // Main-line arrows
  items.forEach((it, i) => {
    if (i === items.length - 1) return;
    const y1 = it.top + it.h, y2 = items[i + 1].top;
    el(s, 'path', { d: `M${CX} ${y1} V${y2 - 1}`, stroke: C('ink-3'), 'stroke-width': 1.8, fill: 'none', 'marker-end': 'url(#a-ink)' });
    if (it.gate) txt(s, CX + 10, y1 + 17, 'yes', { cls: 'mono', size: 11.5, weight: 600, fill: C('go') });
  });

  // Rails: every "no" joins one line per side, which ends in a single arrow into the target box.
  for (const side of ['L', 'R']) {
    const rail = side === 'L' ? railL : railR;
    const exits = items.filter((it) => (it.no || []).some((n) => n.side === side));
    const tgt = pos[target[side]], tipX = side === 'L' ? CX - GW / 2 : CX + GW / 2, edge = side === 'L' ? BL - 2 : BR + 2;
    const low = exits[exits.length - 1];
    el(s, 'path', { d: rounded([[rail, low.mid - 10], [rail, tgt.mid], [edge, tgt.mid]], 10), fill: 'none', stroke: C('warn'), 'stroke-width': 2, 'marker-end': 'url(#a-warn)' });
    for (const g of exits) {
      const n = g.no.find((k) => k.side === side);
      const last = g === low;
      el(s, 'path', { d: last ? rounded([[tipX, g.mid], [rail, g.mid], [rail, g.mid - 12]], 10) : `M${tipX} ${g.mid} H${rail}`, fill: 'none', stroke: C('warn'), 'stroke-width': 2 });
      if (!last) el(s, 'circle', { cx: rail, cy: g.mid, r: 4, fill: C('warn') });
      txt(s, side === 'L' ? tipX - 12 : tipX + 12, g.mid - 9, n.label, { size: 12, weight: 600, anchor: side === 'L' ? 'end' : 'start', fill: C('warn') });
    }
  }

  // Next feature: Learn back to a new prompt, on the outside
  const L = pos.learn, P = pos.prompt;
  el(s, 'path', { d: rounded([[BL, L.mid], [nextX, L.mid], [nextX, P.mid], [BL - 2, P.mid]], 10), fill: 'none', stroke: C('go'), 'stroke-width': 2, 'marker-end': 'url(#a-go)' });
  txt(s, BL - 12, L.mid - 9, 'next feature', { size: 12, weight: 600, anchor: 'end', fill: C('go') });

  // Shapes
  for (const it of items) {
    if (it.box) {
      let fill = C('surface'), stroke = C('rule-2'), ink = C('ink'), ink2 = C('ink-2'), tagc = C('ink-3');
      if (it.who === 'orch') { fill = C('plate'); stroke = C('plate'); ink = C('plate-ink'); ink2 = C('plate-ink-2'); tagc = C('plate-ink-2'); }
      if (it.who === 'you') { fill = C('go-bg'); stroke = C('go'); tagc = C('go'); }
      el(s, 'rect', { x: BL, y: it.top, width: BW, height: BH, rx: 9, fill, stroke, 'stroke-width': 1.3 });
      txt(s, BL + 18, it.top + 24, it.name, { cls: 'cond', size: 17.5, weight: 600, fill: ink });
      txt(s, BL + 18, it.top + 43, it.sub, { size: 12.5, fill: ink2 });
      const tag = it.tag || (it.who === 'you' ? 'YOU' : 'ORCHESTRATOR');
      txt(s, BR - 16, it.top + 23, tag, { cls: 'mono', size: 10, weight: 600, anchor: 'end', ls: 0.6, fill: tagc });
    } else {
      const isYou = it.who === 'you';
      el(s, 'rect', { x: CX - GW / 2, y: it.top, width: GW, height: GH, rx: GH / 2, fill: isYou ? C('go-bg') : C('surface'), stroke: isYou ? C('go') : C('ink-3'), 'stroke-width': 1.5 });
      txt(s, CX, it.mid + 4.5, it.gate, { size: 13.5, weight: 600, anchor: 'middle', fill: isYou ? C('go') : C('ink') });
    }
  }

  // Side notes
  const noteR = railR + 30, noteW = W - 24 - noteR;
  txt(s, noteR, pos.build.top + 8, 'BACK TO BUILD', { cls: 'mono', size: 10.5, weight: 600, ls: 1, fill: C('warn') });
  wrapText(s, noteR, pos.build.top + 28, 'At most 2 fixes per task and 2 review rounds. Then you decide.', noteW, { size: 12, fill: C('ink-2'), lh: 16 });
  const noteLW = nextX - 24 - 16;
  txt(s, 24, pos.plan.top + 8, 'BACK TO PLAN', { cls: 'mono', size: 10.5, weight: 600, ls: 1, fill: C('warn') });
  wrapText(s, 24, pos.plan.top + 28, 'You approve the changed plan.', noteLW, { size: 12, fill: C('ink-2'), lh: 16 });

  const H = bottom + 34;
  s.setAttribute('viewBox', `0 0 ${W} ${H}`); s.setAttribute('height', H);
  s.querySelector(':scope > rect').setAttribute('height', H - 1);
}

/* ───────────── 2. The team ───────────── */
function drawTeam() {
  const W = 940, H = 676;
  const s = svgRoot('team', W, H);

  // You
  const yx = 170, yw = 600, yy = 24, yh = 92;
  el(s, 'rect', { x: yx, y: yy, width: yw, height: yh, rx: 10, fill: C('go-bg'), stroke: C('go') });
  txt(s, yx + 20, yy + 30, 'YOU', { cls: 'mono', size: 11.5, weight: 600, ls: 1.4, fill: C('go') });
  txt(s, yx + 62, yy + 30, 'decide four kinds of thing, nothing else', { size: 13, fill: C('ink-2') });
  let cx0 = yx + 20;
  for (const m of ['approve the plan', 'yes to Fable', 'run migrations', 'click merge']) {
    cx0 += chip(s, cx0, yy + 50, m, { size: 12, h: 26, pad: 12, bg: C('surface'), stroke: C('go-line'), fill: C('ink') }) + 10;
  }

  // You ↔ orchestrator
  const oy = 170;
  el(s, 'path', { d: `M${W / 2 - 60} ${yy + yh} V${oy - 2}`, stroke: C('ink-3'), 'stroke-width': 1.5, 'marker-end': 'url(#a-ink)', fill: 'none' });
  el(s, 'path', { d: `M${W / 2 + 60} ${oy} V${yy + yh + 2}`, stroke: C('ink-3'), 'stroke-width': 1.5, 'marker-end': 'url(#a-ink)', fill: 'none' });
  txt(s, W / 2 - 72, 147, 'an idea, then a yes', { size: 12, anchor: 'end', fill: C('ink-3') });
  txt(s, W / 2 + 72, 147, 'one plain plan, decisions batched', { size: 12, fill: C('ink-3') });

  // Orchestrator plate
  const ox = 140, ow = 660, oh = 104;
  el(s, 'rect', { x: ox, y: oy, width: ow, height: oh, rx: 10, fill: C('plate') });
  txt(s, ox + 22, oy + 36, 'Orchestrator', { cls: 'cond', size: 22, weight: 600, fill: C('plate-ink') });
  txt(s, ox + ow - 22, oy + 34, 'main session · Opus 5.5 · high', { cls: 'mono', size: 11.5, anchor: 'end', fill: C('plate-ink-2') });
  txt(s, ox + 22, oy + 64, 'Plans with you · writes short briefs · checks every result by command · opens one PR', { size: 13.5, fill: C('plate-ink') });
  txt(s, ox + 22, oy + 86, 'Never writes product code. Never merges.', { size: 13, fill: C('plate-ink-2') });

  // Groups
  const gy = 352;
  const groups = [
    { x: 24, w: 296, head: 'BUILD', sub: 'write code in the build worktree', rows: [
      ['implementer', 'Sonnet · high', 'Codes one small task'],
      ['implementer-wide', 'Sonnet · xhigh', 'Wide or closed task; checks callers first'],
      ['test-writer', 'Sonnet · high', 'Failing tests before the code exists'],
    ] },
    { x: 334, w: 316, head: 'REVIEW', sub: 'read-only · judge the plan or the diff', rows: [
      ['reviewer', 'Opus · xhigh', 'Plans and code for wide or closed work'],
      ['reviewer-light', 'Opus · high', 'The same review, sized for small work'],
      ['adversarial-reviewer', 'Fable', 'Tries to break big work', 'needs your yes'],
    ] },
    { x: 664, w: 252, head: 'LOOK UP', sub: 'read-only · one question', rows: [
      ['scout', 'Sonnet · medium', 'Answers with file:line evidence'],
    ] },
  ];
  // fan-out from the plate
  const busY = 318, stemX = W / 2;
  el(s, 'path', { d: `M${stemX} ${oy + oh} V${busY}`, stroke: C('ink-3'), 'stroke-width': 1.5, fill: 'none' });
  const gcx = groups.map((g) => g.x + g.w / 2);
  el(s, 'path', { d: `M${gcx[0]} ${busY} H${gcx[2]}`, stroke: C('ink-3'), 'stroke-width': 1.5, fill: 'none' });
  for (const x of gcx) el(s, 'path', { d: `M${x} ${busY} V${gy - 2}`, stroke: C('ink-3'), 'stroke-width': 1.5, fill: 'none', 'marker-end': 'url(#a-ink)' });
  txt(s, stemX + 12, oy + oh + 24, 'brief: task · files allowed · Done when', { size: 12, fill: C('ink-3') });
  txt(s, stemX - 12, oy + oh + 24, 'report back in a fixed format', { size: 12, anchor: 'end', fill: C('ink-3') });

  const RH = 70, HH = 56;
  for (const g of groups) {
    const h = HH + g.rows.length * RH + 6;
    el(s, 'rect', { x: g.x, y: gy, width: g.w, height: h, rx: 10, fill: C('surface'), stroke: C('rule-2') });
    txt(s, g.x + 18, gy + 26, g.head, { cls: 'mono', size: 11.5, weight: 600, ls: 1.4 });
    txt(s, g.x + 18, gy + 44, g.sub, { size: 12, fill: C('ink-3') });
    g.rows.forEach(([name, model, job, flag], i) => {
      const ry = gy + HH + i * RH;
      el(s, 'line', { x1: g.x + 18, x2: g.x + g.w - 18, y1: ry, y2: ry, stroke: C('rule') });
      txt(s, g.x + 18, ry + 25, name, { cls: 'mono', size: 13.5, weight: 600 });
      chip(s, g.x + g.w - 18, ry + 11, model, { anchor: 'end', size: 10.5, h: 20 });
      const j = txt(s, g.x + 18, ry + 50, job, { size: 12.5, fill: C('ink-2') });
      warnOverflow(j, g.x + g.w - 14, name);
      if (flag) {
        const jw = j.getComputedTextLength();
        chip(s, g.x + 18 + jw + 8, ry + 37, flag, { size: 10, h: 18, pad: 8, bg: C('go-bg'), fill: C('go'), weight: 600 });
      }
    });
  }
  txt(s, W / 2, H - 22, 'No helper can start another helper. Claude’s built-in helpers are blocked.', { cls: 'mono', size: 11.5, anchor: 'middle', fill: C('ink-3') });
}

/* ───────────── 3. How it fits in your project ───────────── */
function drawWorkspace() {
  const W = 940, H = 470;
  const s = svgRoot('workspace', W, H);

  // Workspace frame
  const fx = 24, fy = 24, fw = 572, fh = 422;
  el(s, 'rect', { x: fx, y: fy, width: fw, height: fh, rx: 12, fill: 'none', stroke: C('rule-2'), 'stroke-dasharray': '6 5' });
  txt(s, fx + 20, fy + 30, 'your-workspace/', { cls: 'mono', size: 14, weight: 600 });
  txt(s, fx + 20, fy + 50, 'open Claude Code here', { size: 12, fill: C('ink-3') });

  const files = [
    ['CLAUDE.md', 'shared rules'], ['ORCHESTRATOR.md', 'the playbook'], ['PLAN.md', 'Now · roadmap · decisions'],
    ['.claude/', 'settings + 7 helpers'], ['backlog/', 'ideas, one file each'], ['ops/', 'production scripts', 'you only'],
  ];
  files.forEach(([f, d, flag], i) => {
    const y = fy + 92 + i * 52;
    el(s, 'line', { x1: fx + 20, x2: fx + 262, y1: y - 18, y2: y - 18, stroke: C('rule') });
    txt(s, fx + 20, y + 2, f, { cls: 'mono', size: 13, weight: 600 });
    const t = txt(s, fx + 20, y + 21, d, { size: 12, fill: C('ink-3') });
    if (flag) chip(s, fx + 20 + t.getComputedTextLength() + 8, y + 9, flag, { size: 10, h: 17, pad: 7, bg: C('go-bg'), fill: C('go'), weight: 600 });
  });

  // Repos inside the workspace
  const rx = 306, rw = 268;
  const repo = (y, h, name, tag, lines, tone) => {
    el(s, 'rect', { x: rx, y, width: rw, height: h, rx: 10, fill: tone === 'plate' ? C('plate') : C('surface'), stroke: tone === 'plate' ? C('plate') : C('rule-2') });
    const ink = tone === 'plate' ? C('plate-ink') : C('ink'), ink2 = tone === 'plate' ? C('plate-ink-2') : C('ink-2');
    txt(s, rx + 18, y + 30, name, { cls: 'mono', size: 14, weight: 600, fill: ink });
    chip(s, rx + rw - 16, y + 15, tag, { anchor: 'end', size: 10.5, h: 20, bg: tone === 'plate' ? C('plate-ink-2') : C('chip'), fill: tone === 'plate' ? C('plate') : C('ink-2') });
    lines.forEach((l, i) => txt(s, rx + 18, y + 56 + i * 19, l, { size: 12.5, fill: ink2 }));
  };
  repo(74, 116, 'app/', 'on main', ['your code repo, a fresh clone', 'agents only read it', 'updated with git pull'], 'surface');
  repo(300, 132, '_worktrees/build', 'feat/<name>', ['second checkout of the same repo', 'helpers write code here', 'they commit; the orchestrator', 'pushes the branch'], 'plate');
  el(s, 'path', { d: `M${rx + rw / 2} 190 V298`, stroke: C('ink-3'), 'stroke-width': 1.5, 'stroke-dasharray': '4 4', fill: 'none', 'marker-end': 'url(#a-ink)' });
  txt(s, rx + rw / 2 + 10, 248, 'branch from origin/main', { size: 11.5, fill: C('ink-3') });

  // GitHub column
  const gx = 652, gw = 264;
  el(s, 'rect', { x: gx, y: fy, width: gw, height: fh, rx: 12, fill: C('surface'), stroke: C('rule-2') });
  txt(s, gx + 20, fy + 30, 'GitHub', { cls: 'mono', size: 14, weight: 600 });
  txt(s, gx + 20, fy + 50, 'the walls live here', { size: 12, fill: C('ink-3') });
  // Read bottom to top: the feature branch climbs to main.
  const steps = [['main', 'protected · no bypass'], ['you merge', 'merge = deploy', 'go'], ['CI checks', 'must pass'], ['pull request', 'same template'], ['feat/<name>', 'feature branch']];
  const sy0 = fy + 82, sp = 64, bh = 40;
  steps.forEach(([n, d, tone], i) => {
    const y = sy0 + i * sp;
    const isGo = tone === 'go';
    el(s, 'rect', { x: gx + 18, y, width: gw - 36, height: bh, rx: 7, fill: isGo ? C('go-bg') : C('board'), stroke: isGo ? C('go') : C('rule-2') });
    txt(s, gx + 32, y + 25, n, { cls: 'mono', size: 12.5, weight: 600, fill: isGo ? C('go') : C('ink') });
    if (d) txt(s, gx + gw - 32, y + 25, d, { size: 11, anchor: 'end', fill: C('ink-3') });
    if (i > 0) el(s, 'path', { d: `M${gx + gw / 2} ${y} V${y - sp + bh + 1}`, stroke: C('ink-3'), 'stroke-width': 1.5, fill: 'none', 'marker-end': 'url(#a-ink)' });
  });

  // build → push → feature branch ; main → pull → app (straight, never crossing)
  const pushY = sy0 + 4 * sp + bh / 2, pullY = sy0 + bh / 2;
  el(s, 'path', { d: `M${rx + rw} ${pushY} H${gx + 16}`, stroke: C('ink-3'), 'stroke-width': 1.5, fill: 'none', 'marker-end': 'url(#a-ink)' });
  txt(s, (rx + rw + gx + 18) / 2, pushY - 8, 'push', { cls: 'mono', size: 11, anchor: 'middle', fill: C('ink-3') });
  el(s, 'path', { d: `M${gx + 18} ${pullY} H${rx + rw + 2}`, stroke: C('ink-3'), 'stroke-width': 1.5, 'stroke-dasharray': '4 4', fill: 'none', 'marker-end': 'url(#a-ink)' });
  txt(s, (rx + rw + gx + 18) / 2, pullY - 8, 'pull', { cls: 'mono', size: 11, anchor: 'middle', fill: C('ink-3') });
}

// Load every face before measuring text; fonts.ready alone resolves before unused faces are fetched.
Promise.all([
  '400 12px "IBM Plex Sans"', '500 12px "IBM Plex Sans"', '600 12px "IBM Plex Sans"',
  '400 12px "IBM Plex Mono"', '500 12px "IBM Plex Mono"', '600 12px "IBM Plex Mono"',
  '600 12px "IBM Plex Sans Condensed"',
].map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => { drawLoop(); drawTeam(); drawWorkspace(); document.body.dataset.ready = '1'; });
</script>
